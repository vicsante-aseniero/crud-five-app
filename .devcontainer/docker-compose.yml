version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    
    # Container name for easy identification
    container_name: crud-five-app

    # Resource limits for 16GB RAM / Intel i7-1355U workstation
    # Leaving headroom for host OS and other applications
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Memory swap limit (total memory + swap)
    memswap_limit: 16G
    
    # CPU shares (relative weight)
    cpu_shares: 1024

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    networks: 
      - keycloak-dbs-brokers_backend_network

    # Using 'vscode' user instead of 'root' for better security
    # The devcontainer base image includes a non-root 'vscode' user
    user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

networks:
  keycloak-dbs-brokers_backend_network:
    external: true
    name: keycloak-dbs-brokers_backend_network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: keycloak-dbs-brokers_backend_network
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 237.84.2.178/16
          gateway: 237.84.2.178
